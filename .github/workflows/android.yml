# Continuous integration: build both Release APK variants on pushes and pull requests.
name: Build-XiangqiAssist

on:
  push:
    branches: [ main ]
    tags: [ 'v1.3' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare release signing key
        if: github.ref == 'refs/tags/v1.3'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo 'missing Android release signing key secret' >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/cchess.release.jks

      - name: Run JVM unit tests
        run: ./gradlew :app:testArmv8-DebugUnitTest --stacktrace

      - name: Assemble ARMv8 Release APKs
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: ./gradlew :app:assembleArmv8-Release :app:assembleArmv8-dotprod-Release --stacktrace

      - name: Verify application identity
        run: |
          for apk in app/build/outputs/apk/*/release/*.apk; do
            echo "Checking $apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$apk" > badging.txt
            grep -F "package: name='com.xiangqi.assist' versionCode='4' versionName='1.3'" badging.txt
            grep -F "application-label:'象棋辅助'" badging.txt
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk" | grep 'Verified using v2 scheme (APK Signature Scheme v2): true'
          done

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiangqi-assist-1.3-apks
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      # Tag v1.3 release assets are signed with the encrypted release key prepared above.
      # Pushes, pull requests and manual branch runs remain build-only with the public-checkout
      # debug key and are not published as release assets.
      - name: Prepare v1.3 release assets
        if: github.ref == 'refs/tags/v1.3'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/armv8-/release/*.apk dist/xiangqi-assist-1.3-armv8.apk
          cp app/build/outputs/apk/armv8-dotprod-/release/*.apk dist/xiangqi-assist-1.3-armv8-dotprod.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Create or update v1.3 Release
        if: github.ref == 'refs/tags/v1.3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v1.3 >/dev/null 2>&1; then
            gh release create v1.3 --title '象棋辅助 1.3' --notes-file docs/RELEASE_1.3.md
          fi
          gh release upload v1.3 dist/*.apk dist/SHA256SUMS.txt --clobber
          gh release edit v1.3 --title '象棋辅助 1.3' --notes-file docs/RELEASE_1.3.md
